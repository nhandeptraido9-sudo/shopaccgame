<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin - SHOPACCGAME</title>


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#eef2f7;

    color:#182238;
}


/* =========================
   HEADER
========================= */

header{

    background:
        linear-gradient(
            90deg,
            #5137df,
            #347bf0
        );

    color:white;

    padding:25px 15px;

    text-align:center;

}

header h1{

    margin:0 0 8px;

}

header p{

    margin:0;

}


/* =========================
   CONTAINER
========================= */

.container{

    max-width:1100px;

    margin:30px auto;

    padding:15px;

}


/* =========================
   BOX
========================= */

.box{

    background:white;

    border-radius:18px;

    padding:25px;

    margin-bottom:20px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.10);

}

.box h2{

    margin-top:0;

}


/* =========================
   THỐNG KÊ
========================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

}

.stat{

    background:#f5f7fb;

    border-radius:14px;

    padding:20px;

    text-align:center;

}

.stat-icon{

    font-size:30px;

}

.stat-number{

    margin-top:8px;

    font-size:26px;

    font-weight:bold;

    color:#5137df;

}

.stat-name{

    margin-top:5px;

    color:#777;

}


/* =========================
   FORM
========================= */

label{

    display:block;

    margin-top:15px;

    margin-bottom:6px;

    font-weight:bold;

}

input,
select{

    width:100%;

    padding:13px;

    border:1px solid #ccd2df;

    border-radius:10px;

    outline:none;

    font-size:15px;

}

input:focus,
select:focus{

    border-color:#5137df;

}


/* =========================
   BUTTON
========================= */

button{

    border:0;

    border-radius:10px;

    padding:12px 16px;

    font-weight:bold;

    cursor:pointer;

}

.main-btn{

    width:100%;

    margin-top:20px;

    background:
        linear-gradient(
            90deg,
            #6647ee,
            #3e79ee
        );

    color:white;

    font-size:16px;

}

.main-btn:hover{

    opacity:.9;

}


.refresh-btn{

    background:#edf0f7;

    color:#5137df;

    margin-bottom:10px;

}


.delete-btn{

    background:#e53935;

    color:white;

    margin-top:12px;

    width:100%;

}


.show-btn{

    background:#5137df;

    color:white;

    width:100%;

    margin-top:12px;

}


/* =========================
   MESSAGE
========================= */

.message{

    text-align:center;

    margin-top:15px;

    min-height:20px;

    font-weight:bold;

}


/* =========================
   ORDER
========================= */

.order{

    border:1px solid #e1e5ee;

    border-radius:14px;

    padding:18px;

    margin-top:15px;

    background:white;

}

.order-title{

    font-size:19px;

    font-weight:bold;

}

.order-row{

    display:flex;

    justify-content:space-between;

    gap:15px;

    margin-top:10px;

    color:#555;

}

.status{

    display:inline-block;

    margin-top:12px;

    padding:7px 12px;

    border-radius:8px;

    background:#dff7e7;

    color:#168044;

    font-size:13px;

    font-weight:bold;

}


/* =========================
   ACCOUNT
========================= */

.account{

    display:none;

    margin-top:15px;

    padding:15px;

    border-radius:12px;

    background:#f5f7fb;

}

.account-row{

    margin:9px 0;

    word-break:break-all;

}

.account-label{

    font-weight:bold;

}


/* =========================
   BACK
========================= */

.back{

    display:block;

    text-align:center;

    padding:14px;

    border-radius:10px;

    background:#edf0f7;

    color:#5137df;

    text-decoration:none;

    font-weight:bold;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .stats{

        grid-template-columns:1fr;

    }

    .order-row{

        flex-direction:column;

    }

}

</style>

</head>


<body>


<header>

    <h1>🛠️ SHOPACCGAME ADMIN</h1>

    <p>Quản lý đơn hàng và tài khoản</p>

</header>


<div class="container">


<!-- =========================
     THỐNG KÊ
========================= -->

<div class="box">

    <h2>📊 Thống kê</h2>


    <div class="stats">


        <div class="stat">

            <div class="stat-icon">
                👥
            </div>

            <div
                class="stat-number"
                id="customerCount">
                0
            </div>

            <div class="stat-name">
                Khách hàng
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                📦
            </div>

            <div
                class="stat-number"
                id="orderCount">
                0
            </div>

            <div class="stat-name">
                Đơn hàng
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🎮
            </div>

            <div
                class="stat-number"
                id="deliveredCount">
                0
            </div>

            <div class="stat-name">
                Acc đã giao
            </div>

        </div>


    </div>

</div>



<!-- =========================
     TẠO ĐƠN
========================= -->

<div class="box">

    <h2>📦 Tạo đơn hàng</h2>


    <label>
        👤 Tên khách hàng
    </label>

    <input
        id="orderUsername"
        type="text"
        placeholder="Nhập tên tài khoản khách">


    <label>
        🎮 Sản phẩm
    </label>

    <select id="orderProduct">

        <option value="Acc Blox Fruits">
            Acc Blox Fruits
        </option>

        <option value="Acc Roblox">
            Acc Roblox
        </option>

    </select>


    <label>
        💰 Giá
    </label>

    <input
        id="orderPrice"
        type="text"
        placeholder="Ví dụ: 50.000đ">


    <label>
        👤 Name Acc
    </label>

    <input
        id="accountName"
        type="text"
        placeholder="Nhập Name acc">


    <label>
        🔑 Pass Acc
    </label>

    <input
        id="accountPass"
        type="password"
        placeholder="Nhập Pass acc">


    <button
        class="main-btn"
        type="button"
        onclick="createOrder()">

        📦 Giao đơn hàng

    </button>


    <div
        id="orderMessage"
        class="message">
    </div>

</div>



<!-- =========================
     ACC ĐÃ GIAO
========================= -->

<div class="box">

    <h2>
        🎮 Acc đã giao cho khách
    </h2>


    <button
        class="refresh-btn"
        onclick="renderOrders()">

        🔄 Làm mới

    </button>


    <div id="accHistory"></div>

</div>



<!-- =========================
     QUAY LẠI
========================= -->

<a
    href="index.html"
    class="back">

    ← Quay lại SHOPACCGAME

</a>


</div>



<script>


/* =====================================
   KIỂM TRA ADMIN
===================================== */

const adminLoggedIn =
    sessionStorage.getItem(
        "adminLoggedIn"
    );


if(adminLoggedIn !== "true"){

    alert(
        "❌ Bạn chưa đăng nhập Admin!"
    );

    window.location.href =
        "login.html";

}


/* =====================================
   TẠO ĐƠN HÀNG
===================================== */

function createOrder(){


    const username =
        document
        .getElementById(
            "orderUsername"
        )
        .value
        .trim();


    const product =
        document
        .getElementById(
            "orderProduct"
        )
        .value;


    const price =
        document
        .getElementById(
            "orderPrice"
        )
        .value
        .trim();


    const accountName =
        document
        .getElementById(
            "accountName"
        )
        .value
        .trim();


    const accountPass =
        document
        .getElementById(
            "accountPass"
        )
        .value;


    const message =
        document.getElementById(
            "orderMessage"
        );


    /* KIỂM TRA */

    if(
        !username ||
        !product ||
        !price ||
        !accountName ||
        !accountPass
    ){

        message.style.color =
            "#e53935";

        message.textContent =
            "❌ Vui lòng nhập đầy đủ thông tin.";

        return;

    }


    /* LẤY ĐƠN CŨ */

    let orders =
        JSON.parse(
            localStorage.getItem(
                "shopOrders"
            ) || "[]"
        );


    /* TẠO MÃ ĐƠN */

    const order = {

        id:
            "DH" +
            Date.now(),

        username:
            username,

        product:
            product,

        price:
            price,

        date:
            new Date()
            .toLocaleString(
                "vi-VN"
            ),

        status:
            "Đã giao",

        accountName:
            accountName,

        accountPass:
            accountPass

    };


    /* THÊM ĐƠN */

    orders.push(order);


    /* LƯU */

    localStorage.setItem(

        "shopOrders",

        JSON.stringify(
            orders
        )

    );


    /* THÔNG BÁO */

    message.style.color =
        "#00a66a";

    message.textContent =
        "✅ Giao đơn hàng thành công!";


    /* XÓA FORM */

    document
    .getElementById(
        "orderUsername"
    )
    .value = "";


    document
    .getElementById(
        "orderPrice"
    )
    .value = "";


    document
    .getElementById(
        "accountName"
    )
    .value = "";


    document
    .getElementById(
        "accountPass"
    )
    .value = "";


    /* CẬP NHẬT */

    renderOrders();

}


/* =====================================
   HIỂN THỊ ĐƠN
===================================== */

function renderOrders(){


    const orders =
        JSON.parse(

            localStorage.getItem(
                "shopOrders"
            ) || "[]"

        );


    const box =
        document.getElementById(
            "accHistory"
        );


    box.innerHTML = "";


    /* KHÔNG CÓ ĐƠN */

    if(orders.length === 0){

        box.innerHTML = `

            <div
                style="
                    text-align:center;
                    padding:30px;
                    color:#777;
                ">

                📦 Chưa có acc nào được giao.

            </div>

        `;

        updateStats(
            orders
        );

        return;

    }


    /* HIỂN THỊ TỪNG ĐƠN */

    orders
    .slice()
    .reverse()
    .forEach(

        (order,index) => {


            const realIndex =
                orders.length -
                1 -
                index;


            const item =
                document
                .createElement(
                    "div"
                );


            item.className =
                "order";


            item.innerHTML = `

                <div class="order-title">

                    📦 ${escapeHTML(
                        order.id
                    )}

                </div>


                <div class="order-row">

                    <span>

                        👤 Khách:

                        <b>
                            ${escapeHTML(
                                order.username
                            )}
                        </b>

                    </span>


                    <span>

                        💰

                        ${escapeHTML(
                            order.price
                        )}

                    </span>

                </div>


                <div class="order-row">

                    <span>

                        🎮

                        ${escapeHTML(
                            order.product
                        )}

                    </span>


                    <span>

                        📅

                        ${escapeHTML(
                            order.date
                        )}

                    </span>

                </div>


                <span class="status">

                    🟢 ${escapeHTML(
                        order.status
                    )}

                </span>


                <button

                    class="show-btn"

                    type="button"

                    onclick="
                        toggleAccount(
                            ${realIndex}
                        )
                    ">

                    👁 Xem Name + Pass

                </button>


                <div
                    class="account"
                    id="account-${realIndex}">


                    <div class="account-row">

                        <span
                            class="account-label">

                            👤 Name:

                        </span>

                        <span>

                            ${escapeHTML(
                                order.accountName
                            )}

                        </span>

                    </div>


                    <div class="account-row">

                        <span
                            class="account-label">

                            🔑 Pass:

                        </span>

                        <span>

                            ${escapeHTML(
                                order.accountPass
                            )}

                        </span>

                    </div>


                    <button

                        class="delete-btn"

                        type="button"

                        onclick="
                            deleteOrder(
                                ${realIndex}
                            )
                        ">

                        🗑️ Xóa đơn

                    </button>


                </div>

            `;


            box.appendChild(
                item
            );

        }

    );


    updateStats(
        orders
    );

}


/* =====================================
   HIỆN / ẨN NAME + PASS
===================================== */

function toggleAccount(index){


    const account =
        document.getElementById(
            "account-" + index
        );


    if(
        account.style.display ===
        "block"
    ){

        account.style.display =
            "none";

    }else{

        account.style.display =
            "block";

    }

}


/* =====================================
   XÓA ĐƠN
===================================== */

function deleteOrder(index){


    const ok =
        confirm(
            "Bạn có chắc muốn xóa đơn này?"
        );


    if(!ok){

        return;

    }


    let orders =
        JSON.parse(

            localStorage.getItem(
                "shopOrders"
            ) || "[]"

        );


    orders.splice(
        index,
        1
    );


    localStorage.setItem(

        "shopOrders",

        JSON.stringify(
            orders
        )

    );


    renderOrders();

}


/* =====================================
   THỐNG KÊ
===================================== */

function updateStats(
    orders
){


    const users =
        JSON.parse(

            localStorage.getItem(
                "shopUsers"
            ) || "{}"

        );


    document
    .getElementById(
        "customerCount"
    )
    .textContent =
        Object.keys(
            users
        ).length;


    document
    .getElementById(
        "orderCount"
    )
    .textContent =
        orders.length;


    document
    .getElementById(
        "deliveredCount"
    )
    .textContent =
        orders.length;

}


/* =====================================
   CHỐNG HTML LẠ
===================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================
   CHẠY KHI MỞ ADMIN
===================================== */

renderOrders();

</script>


</body>

</html>
