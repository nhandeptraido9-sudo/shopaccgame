<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin - SHOPACCGAME</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
    color:#182238;
}

header{
    background:linear-gradient(90deg,#5137df,#347bf0);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:15px;
}

.box{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:18px;
    box-shadow:0 5px 20px #0002;
}

label{
    display:block;
    margin:15px 0 6px;
    font-weight:bold;
}

select,
input{
    width:100%;
    padding:13px;
    border:1px solid #ccd2df;
    border-radius:10px;
    font-size:15px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    font-weight:bold;
    cursor:pointer;
}

.save{
    width:100%;
    margin-top:20px;
    background:linear-gradient(90deg,#6647ee,#3e79ee);
    color:white;
}

.refresh{
    background:#edf0f7;
    color:#5137df;
    margin-bottom:15px;
}

.delete{
    width:100%;
    margin-top:12px;
    background:#e53935;
    color:white;
}

.logout{
    width:100%;
    background:#e53935;
    color:white;
}

.message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
    font-weight:bold;
}

.package{
    background:#f5f7fb;
    padding:16px;
    border-radius:12px;
    margin-top:12px;
}

.account{
    background:white;
    padding:14px;
    border-radius:10px;
    margin-top:10px;
}

.customer-order{
    background:#f5f7fb;
    border-radius:12px;
    padding:16px;
    margin-top:12px;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:6px 10px;
    border-radius:8px;
    background:#dff7e7;
    color:#168044;
    font-size:13px;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    padding:14px;
    background:#edf0f7;
    color:#5137df;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>


<body>


<header>

<h1>🛠️ SHOPACCGAME ADMIN</h1>

<p>Quản lý kho acc và acc đã giao</p>

</header>


<div class="container">


<!-- =================================
     THÊM ACC VÀO KHO
================================= -->

<div class="box">

<h2>🎮 Thêm acc Blox Fruits vào kho</h2>


<label>💰 Mệnh giá</label>

<select id="price">

<option value="0">0K</option>
<option value="10000">10K</option>
<option value="20000">20K</option>
<option value="50000">50K</option>
<option value="80000">80K</option>
<option value="100000">100K</option>

</select>


<label>🎁 Gói</label>

<select id="package">

<option value="1">Gói 1</option>
<option value="2">Gói 2</option>
<option value="3">Gói 3</option>
<option value="4">Gói 4</option>
<option value="5">Gói 5</option>
<option value="6">Gói 6</option>
<option value="7">Gói 7</option>
<option value="8">Gói 8</option>

</select>


<label>👤 Name acc</label>

<input
id="accountName"
type="text"
placeholder="Nhập Name acc">


<label>🔑 Pass acc</label>

<input
id="accountPass"
type="password"
placeholder="Nhập Pass acc">


<button
class="save"
onclick="saveAccount()">

💾 Lưu acc vào kho

</button>


<div
id="message"
class="message">
</div>

</div>



<!-- =================================
     KHO 48 GÓI
================================= -->

<div class="box">

<h2>📦 Kho 48 gói túi mù</h2>

<button
class="refresh"
onclick="renderInventory()">

🔄 Làm mới kho

</button>

<div id="inventory"></div>

</div>



<!-- =================================
     ACC KHÁCH ĐÃ NHẬN
================================= -->

<div class="box">

<h2>🎮 Acc khách đã nhận</h2>

<p>
Danh sách các acc đã được giao cho khách.
</p>


<button
class="refresh"
onclick="renderDelivered()">

🔄 Làm mới danh sách

</button>


<div id="deliveredList"></div>

</div>



<!-- =================================
     ĐĂNG XUẤT
================================= -->

<div class="box">

<button
class="logout"
onclick="logoutAdmin()">

🚪 Đăng xuất Admin

</button>

</div>


<a
href="index.html"
class="back">

← Quay lại Shop

</a>


</div>


<script>


/* =================================
   KIỂM TRA ADMIN
================================= */

if(
sessionStorage.getItem(
"adminLoggedIn"
)!=="true"
){

window.location.href=
"login.html";

}


/* =================================
   MỆNH GIÁ
================================= */

const prices=[

{
value:"0",
label:"0K"
},

{
value:"10000",
label:"10K"
},

{
value:"20000",
label:"20K"
},

{
value:"50000",
label:"50K"
},

{
value:"80000",
label:"80K"
},

{
value:"100000",
label:"100K"
}

];


/* =================================
   LẤY KHO
================================= */

function getInventory(){

return JSON.parse(

localStorage.getItem(
"shopInventory"
)||"{}"

);

}


/* =================================
   LƯU KHO
================================= */

function saveInventory(data){

localStorage.setItem(

"shopInventory",

JSON.stringify(data)

);

}


/* =================================
   LƯU ACC
================================= */

function saveAccount(){

const price=
document.getElementById(
"price"
).value;


const packageNumber=
document.getElementById(
"package"
).value;


const name=
document.getElementById(
"accountName"
).value.trim();


const pass=
document.getElementById(
"accountPass"
).value;


const message=
document.getElementById(
"message"
);


if(!name||!pass){

message.style.color=
"#e53935";

message.textContent=
"❌ Vui lòng nhập Name và Pass.";

return;

}


let inventory=
getInventory();


if(!inventory[price]){

inventory[price]={};

}


inventory[price][packageNumber]={

name:name,

pass:pass,

addedAt:
new Date()
.toLocaleString("vi-VN")

};


saveInventory(
inventory
);


message.style.color=
"#00a66a";

message.textContent=
"✅ Đã lưu acc thành công.";


document.getElementById(
"accountName"
).value="";


document.getElementById(
"accountPass"
).value="";


renderInventory();

}


/* =================================
   HIỂN THỊ KHO
================================= */

function renderInventory(){

const inventory=
getInventory();


const box=
document.getElementById(
"inventory"
);


box.innerHTML="";


prices.forEach(
price=>{

const title=
document.createElement(
"h3"
);

title.textContent=
"🎁 "+price.label;

box.appendChild(
title
);


for(
let i=1;
i<=8;
i++
){

const account=
inventory[
price.value
] &&
inventory[
price.value
][i];


const item=
document.createElement(
"div"
);

item.className=
"package";


if(account){

item.innerHTML=`

<b>
🎁 Gói ${i}
</b>

<span
style="color:#00a66a">

🟢 Có acc

</span>

<div class="account">

👤 Name:

<b>
${escapeHTML(
account.name
)}
</b>

<br><br>

🔑 Pass:

<b>
${escapeHTML(
account.pass
)}
</b>

<br><br>

<button
class="delete"
onclick="
deleteAccount(
'${price.value}',
'${i}'
)">

🗑️ Xóa acc

</button>

</div>

`;

}else{

item.innerHTML=`

<b>
🎁 Gói ${i}
</b>

<span
style="color:#e53935">

🔴 Chưa có acc

</span>

`;

}


box.appendChild(
item
);

}

}

);

}


/* =================================
   XÓA ACC KHO
================================= */

function deleteAccount(
price,
packageNumber
){

if(
!confirm(
"Bạn có chắc muốn xóa acc này?"
)
){

return;

}


let inventory=
getInventory();


if(
inventory[price] &&
inventory[price][packageNumber]
){

delete inventory[
price
][
packageNumber
];

}


saveInventory(
inventory
);


renderInventory();

}


/* =================================
   HIỂN THỊ ACC KHÁCH ĐÃ NHẬN
================================= */

function renderDelivered(){

const orders=
JSON.parse(

localStorage.getItem(
"shopOrders"
)||"[]"

);


const box=
document.getElementById(
"deliveredList"
);


box.innerHTML="";


if(orders.length===0){

box.innerHTML=`

<div class="empty">

📦 Chưa có acc nào được giao cho khách.

</div>

`;

return;

}


orders
.slice()
.reverse()
.forEach(
order=>{

const item=
document.createElement(
"div"
);

item.className=
"customer-order";


item.innerHTML=`

<b>
📦 ${escapeHTML(
order.id
)}
</b>

<br><br>

👤 Khách:

<b>
${escapeHTML(
order.username
)}
</b>

<br><br>

🎮 Sản phẩm:

${escapeHTML(
order.product
)}

<br><br>

💰 Giá:

<b>
${escapeHTML(
order.price
)}
</b>

<br><br>

🎁 Gói:

${escapeHTML(
order.package ||
"Không xác định"
)}

<br><br>

👤 Name acc:

<b>
${escapeHTML(
order.accountName
)}
</b>

<br><br>

🔑 Pass acc:

<b>
${escapeHTML(
order.accountPass
)}
</b>

<br><br>

📅 Thời gian:

${escapeHTML(
order.date
)}

<br>

<span class="status">

🟢 Đã giao

</span>

`;


box.appendChild(
item
);

}

);

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =================================
   ĐĂNG XUẤT
================================= */

function logoutAdmin(){

sessionStorage.removeItem(
"adminLoggedIn"
);

window.location.href=
"login.html";

}


/* =================================
   KHỞI ĐỘNG
================================= */

renderInventory();

renderDelivered();

</script>

</body>
</html>
