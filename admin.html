<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - SHOPACCGAME</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
    color:#182238;
}

header{
    background:linear-gradient(90deg,#5137df,#347bf0);
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:15px;
}

.box{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:18px;
    box-shadow:0 5px 20px #0002;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat{
    background:#f5f7fb;
    padding:20px;
    border-radius:14px;
    text-align:center;
}

.stat-icon{
    font-size:30px;
}

.stat-number{
    font-size:27px;
    font-weight:bold;
    color:#5137df;
    margin-top:8px;
}

.stat-name{
    color:#777;
    margin-top:5px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ccd2df;
    border-radius:10px;
    font-size:15px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    font-weight:bold;
    cursor:pointer;
}

.main-btn{
    width:100%;
    margin-top:20px;
    background:linear-gradient(90deg,#6647ee,#3e79ee);
    color:white;
    font-size:16px;
}

.refresh-btn{
    background:#edf0f7;
    color:#5137df;
    margin-bottom:10px;
}

.logout-btn{
    width:100%;
    background:#e53935;
    color:white;
    margin-top:10px;
}

.message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
    font-weight:bold;
}

.order{
    background:#f8f9fc;
    border:1px solid #e1e5ee;
    border-radius:14px;
    padding:18px;
    margin-top:15px;
}

.order-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.order-row{
    margin-top:8px;
}

.status{
    display:inline-block;
    margin-top:12px;
    padding:7px 12px;
    border-radius:8px;
    background:#dff7e7;
    color:#168044;
    font-size:13px;
    font-weight:bold;
}

.account{
    display:none;
    margin-top:15px;
    padding:15px;
    background:white;
    border-radius:10px;
    border:1px solid #ddd;
}

.show-btn{
    width:100%;
    margin-top:12px;
    background:#5137df;
    color:white;
}

.delete-btn{
    width:100%;
    margin-top:12px;
    background:#e53935;
    color:white;
}

.customer{
    padding:15px;
    margin-top:12px;
    background:#f5f7fb;
    border-radius:12px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

.back{
    display:block;
    text-align:center;
    padding:14px;
    background:#edf0f7;
    color:#5137df;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header>

    <h1>🛠️ SHOPACCGAME ADMIN</h1>

    <p>Quản lý shop</p>

</header>


<div class="container">


<!-- =========================
     THỐNG KÊ
========================= -->

<div class="box">

    <h2>📊 Thống kê</h2>

    <div class="stats">

        <div class="stat">

            <div class="stat-icon">
                👥
            </div>

            <div
                id="customerCount"
                class="stat-number">
                0
            </div>

            <div class="stat-name">
                Khách hàng
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                📦
            </div>

            <div
                id="orderCount"
                class="stat-number">
                0
            </div>

            <div class="stat-name">
                Đơn hàng
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🎮
            </div>

            <div
                id="deliveredCount"
                class="stat-number">
                0
            </div>

            <div class="stat-name">
                Acc đã giao
            </div>

        </div>

    </div>

</div>


<!-- =========================
     KHÁCH HÀNG
========================= -->

<div class="box">

    <h2>👥 Khách hàng</h2>

    <div id="customerList"></div>

</div>


<!-- =========================
     TẠO ĐƠN
========================= -->

<div class="box">

    <h2>📦 Tạo đơn hàng</h2>


    <label>👤 Tên khách hàng</label>

    <input
        id="orderUsername"
        type="text"
        placeholder="Nhập tên tài khoản khách">


    <label>🎮 Sản phẩm</label>

    <select id="orderProduct">

        <option value="Acc Blox Fruits">
            Acc Blox Fruits
        </option>

        <option value="Acc Roblox">
            Acc Roblox
        </option>

    </select>


    <label>💰 Giá</label>

    <input
        id="orderPrice"
        type="text"
        placeholder="Ví dụ: 50.000đ">


    <label>👤 Name Acc</label>

    <input
        id="accountName"
        type="text"
        placeholder="Nhập Name acc">


    <label>🔑 Pass Acc</label>

    <input
        id="accountPass"
        type="password"
        placeholder="Nhập Pass acc">


    <button
        class="main-btn"
        onclick="createOrder()">

        📦 Giao đơn hàng

    </button>


    <div
        id="orderMessage"
        class="message">
    </div>

</div>


<!-- =========================
     ACC ĐÃ GIAO
========================= -->

<div class="box">

    <h2>🎮 Acc đã giao cho khách</h2>

    <button
        class="refresh-btn"
        onclick="renderOrders()">

        🔄 Làm mới

    </button>

    <div id="accHistory"></div>

</div>


<!-- =========================
     ĐĂNG XUẤT
========================= -->

<div class="box">

    <button
        class="logout-btn"
        onclick="logoutAdmin()">

        🚪 Đăng xuất Admin

    </button>

</div>


<a
    class="back"
    href="index.html">

    ← Quay lại Shop

</a>


</div>


<script>

/* =========================
   KIỂM TRA ADMIN
========================= */

if(
    sessionStorage.getItem("adminLoggedIn")
    !== "true"
){

    window.location.href =
        "login.html";

}


/* =========================
   TẠO ĐƠN
========================= */

function createOrder(){

    const username =
        document
        .getElementById("orderUsername")
        .value
        .trim();

    const product =
        document
        .getElementById("orderProduct")
        .value;

    const price =
        document
        .getElementById("orderPrice")
        .value
        .trim();

    const accountName =
        document
        .getElementById("accountName")
        .value
        .trim();

    const accountPass =
        document
        .getElementById("accountPass")
        .value;

    const message =
        document
        .getElementById("orderMessage");


    if(
        !username ||
        !product ||
        !price ||
        !accountName ||
        !accountPass
    ){

        message.style.color =
            "#e53935";

        message.textContent =
            "❌ Vui lòng nhập đầy đủ thông tin.";

        return;

    }


    let orders =
        JSON.parse(
            localStorage.getItem(
                "shopOrders"
            ) || "[]"
        );


    const order = {

        id:
            "DH" + Date.now(),

        username:
            username,

        product:
            product,

        price:
            price,

        date:
            new Date()
            .toLocaleString("vi-VN"),

        status:
            "Đã giao",

        accountName:
            accountName,

        accountPass:
            accountPass

    };


    orders.push(order);


    localStorage.setItem(
        "shopOrders",
        JSON.stringify(orders)
    );


    message.style.color =
        "#00a66a";

    message.textContent =
        "✅ Giao đơn hàng thành công!";


    document.getElementById(
        "orderUsername"
    ).value = "";

    document.getElementById(
        "orderPrice"
    ).value = "";

    document.getElementById(
        "accountName"
    ).value = "";

    document.getElementById(
        "accountPass"
    ).value = "";


    renderOrders();

}


/* =========================
   HIỂN THỊ ĐƠN
========================= */

function renderOrders(){

    const orders =
        JSON.parse(
            localStorage.getItem(
                "shopOrders"
            ) || "[]"
        );


    const box =
        document.getElementById(
            "accHistory"
        );


    box.innerHTML = "";


    if(orders.length === 0){

        box.innerHTML =
            '<div class="empty">' +
            '📦 Chưa có acc nào được giao.' +
            '</div>';

        updateStats(orders);

        return;

    }


    orders
    .slice()
    .reverse()
    .forEach(
        (order,index) => {

            const realIndex =
                orders.length - 1 - index;


            const item =
                document.createElement("div");

            item.className =
                "order";


            item.innerHTML = `

                <div class="order-title">
                    📦 ${escapeHTML(order.id)}
                </div>

                <div class="order-row">
                    👤 Khách:
                    <b>
                        ${escapeHTML(order.username)}
                    </b>
                </div>

                <div class="order-row">
                    🎮 ${escapeHTML(order.product)}
                </div>

                <div class="order-row">
                    💰 ${escapeHTML(order.price)}
                </div>

                <div class="order-row">
                    📅 ${escapeHTML(order.date)}
                </div>

                <span class="status">
                    🟢 ${escapeHTML(order.status)}
                </span>


                <button
                    class="show-btn"
                    onclick="toggleAccount(${realIndex})">

                    👁 Xem Name + Pass

                </button>


                <div
                    class="account"
                    id="account-${realIndex}">

                    <div>
                        👤 Name:
                        <b>
                            ${escapeHTML(
                                order.accountName
                            )}
                        </b>
                    </div>

                    <br>

                    <div>
                        🔑 Pass:
                        <b>
                            ${escapeHTML(
                                order.accountPass
                            )}
                        </b>
                    </div>


                    <button
                        class="delete-btn"
                        onclick="deleteOrder(${realIndex})">

                        🗑️ Xóa đơn

                    </button>

                </div>

            `;


            box.appendChild(item);

        }
    );


    updateStats(orders);

}


/* =========================
   XEM ACC
========================= */

function toggleAccount(index){

    const account =
        document.getElementById(
            "account-" + index
        );


    if(
        account.style.display ===
        "block"
    ){

        account.style.display =
            "none";

    }else{

        account.style.display =
            "block";

    }

}


/* =========================
   XÓA ĐƠN
========================= */

function deleteOrder(index){

    if(
        !confirm(
            "Bạn có chắc muốn xóa đơn này?"
        )
    ){

        return;

    }


    let orders =
        JSON.parse(
            localStorage.getItem(
                "shopOrders"
            ) || "[]"
        );


    orders.splice(index,1);


    localStorage.setItem(
        "shopOrders",
        JSON.stringify(orders)
    );


    renderOrders();

}


/* =========================
   KHÁCH HÀNG
========================= */

function renderCustomers(){

    const users =
        JSON.parse(
            localStorage.getItem(
                "shopUsers"
            ) || "{}"
        );


    const box =
        document.getElementById(
            "customerList"
        );


    box.innerHTML = "";


    const names =
        Object.keys(users);


    if(names.length === 0){

        box.innerHTML =
            '<div class="empty">' +
            '👥 Chưa có khách hàng.' +
            '</div>';

        return;

    }


    names.forEach(username => {

        const item =
            document.createElement("div");

        item.className =
            "customer";


        item.innerHTML = `

            👤 Tên khách:

            <b>
                ${escapeHTML(username)}
            </b>

        `;


        box.appendChild(item);

    });

}


/* =========================
   THỐNG KÊ
========================= */

function updateStats(orders){

    const users =
        JSON.parse(
            localStorage.getItem(
                "shopUsers"
            ) || "{}"
        );


    document.getElementById(
        "customerCount"
    ).textContent =
        Object.keys(users).length;


    document.getElementById(
        "orderCount"
    ).textContent =
        orders.length;


    document.getElementById(
        "deliveredCount"
    ).textContent =
        orders.length;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   ĐĂNG XUẤT ADMIN
========================= */

function logoutAdmin(){

    sessionStorage.removeItem(
        "adminLoggedIn"
    );

    window.location.href =
        "login.html";

}


/* =========================
   KHỞI ĐỘNG
========================= */

renderCustomers();

renderOrders();

</script>

</body>
</html>
