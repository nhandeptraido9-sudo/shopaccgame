header{

.menu a{

.menu a:hover{

.hero{

margin:auto;
padding:0 15px 40px
}

.title{
text-align:center;
margin:35px 0 20px
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

}

.product{
background:white;
padding:22px;
border-radius:15px;
text-align:center;
box-shadow:
0 4px 15px rgba(0,0,0,.08)

.product a{
display:block;
background:#2563eb;
color:white;
padding:12px;
border-radius:9px;
text-decoration:none;
font-weight:bold
}

.price{
color:#2563eb;
font-size:20px;

footer{
