```html
<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOPACCGAME</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    color:#172033;
}

.header{
    background:linear-gradient(135deg,#111827,#2563eb);
    color:white;
    padding:22px;
    text-align:center;
}

.header h1{
    margin:0;
}

.user-bar{
    background:white;
    padding:12px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.logout{
    padding:8px 14px;
    background:#dc2626;
    color:white;
    border:0;
    border-radius:7px;
    cursor:pointer;
}

.container{
    width:95%;
    max-width:1200px;
    margin:25px auto;
}

.products{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

/* Ô ACC BLOX FRUIT */

.acc-blox-card{
    width:280px;
    max-width:100%;
    background:#fff;
    border:2px solid #c9e3ff;
    border-radius:15px;
    padding:8px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.2s;
}

.acc-blox-card:hover{
    transform:translateY(-4px);
}

.acc-blox-card img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:10px;
}

.acc-blox-card h2{
    font-size:19px;
    margin:16px 0 8px;
}

.stock{
    color:#555;
    margin:0 0 13px;
}

.view-all{
    display:block;
    padding:11px;
    background:
        linear-gradient(90deg,#48a9f8,#596ed8);
    color:white;
    text-decoration:none;
    border-radius:9px;
    font-weight:bold;
}

.view-all:hover{
    opacity:.9;
}
</style>

</head>

<body>

<div class="header">
    <h1>🎮 SHOPACCGAME</h1>
</div>

<div class="user-bar">

    <div>
        👤 Xin chào,
        <b id="username"></b>
    </div>

    <button
        class="logout"
        onclick="logout()"
    >
        Đăng xuất
    </button>

</div>

<div class="container">

    <h2>🔥 KHO TÀI KHOẢN</h2>

    <div class="products">

        <!-- CHỈ 1 Ô ACC BLOX FRUIT -->

        <div class="acc-blox-card">

            <img
                src="blox-fruit.jpg"
                alt="ACC BLOX FRUIT"
            >

            <h2>
                ACC BLOX FRUIT
            </h2>

            <p class="stock">
                Còn 6
            </p>

            <a
                href="acc-blox-fruit.html"
                class="view-all"
            >
                XEM TẤT CẢ →
            </a>

        </div>

    </div>

</div>

<script>

/* KIỂM TRA ĐĂNG NHẬP */

const loggedIn =
    localStorage.getItem("shop_logged_in");

if(loggedIn !== "true"){

    window.location.href =
        "login.html";

}

/* HIỆN TÊN KHÁCH */

document.getElementById("username")
    .textContent =
    localStorage.getItem(
        "shop_current_user"
    ) || "Khách hàng";


/* ĐĂNG XUẤT */

function logout(){

    localStorage.removeItem(
        "shop_logged_in"
    );

    localStorage.removeItem(
        "shop_current_user"
    );

    window.location.href =
        "login.html";
}

</script>

</body>
</html>
```
