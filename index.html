<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>SHOPACCGAME</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#111827;
    color:white;
    padding:15px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.menu{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.menu a{
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
}

.menu a:hover{
    background:#2563eb;
}

.hero{
    max-width:1100px;
    margin:30px auto;
    padding:45px 20px;
    text-align:center;
    border-radius:20px;
    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
    color:white;
}

.hero h1{
    margin:0;
    font-size:38px;
}

.hero p{
    font-size:18px;
}

.button{
    display:inline-block;
    margin:8px;
    padding:13px 22px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    background:white;
    color:#2563eb;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.title{
    text-align:center;
}

.products{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card a{
    display:block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
}

footer{
    margin-top:40px;
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
}
</style>
</head>

>

>
