<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOPACCGAME</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111827;
}

header{
position:sticky;
top:0;
z-index:1000;
background:#111827;
color:white;
padding:14px 5%;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.logo{
font-size:23px;
font-weight:bold;
}

.nav{
display:flex;
align-items:center;
gap:10px;
}

.nav a{
color:white;
text-decoration:none;
padding:10px 13px;
border-radius:8px;
}

.nav a:hover{
background:#2563eb;
}

.customer-area{
position:relative;
}

.customer-button{
border:0;
background:#2563eb;
color:white;
padding:10px 15px;
border-radius:9px;
cursor:pointer;
font-size:15px;
font-weight:bold;
}

.customer-menu{
display:none;
position:absolute;
right:0;
top:48px;
width:280px;
background:white;
color:#111827;
border-radius:12px;
box-shadow:0 8px 30px rgba(0,0,0,.2);
padding:12px;
z-index:9999;
}

.customer-menu.show{
display:block;
}

.customer-title{
font-size:18px;
font-weight:bold;
padding:8px;
border-bottom:1px solid #e5e7eb;
margin-bottom:8px;
}

.customer-info{
padding:8px;
font-size:14px;
}

.customer-menu button{
width:100%;
border:0;
padding:11px;
margin-top:6px;
border-radius:8px;
background:#f3f4f6;
cursor:pointer;
text-align:left;
font-size:14px;
}

.customer-menu button:hover{
background:#e5e7eb;
}

.logout-button{
background:#fee2e2!important;
color:#b91c1c;
}

.hero{
text-align:center;
padding:50px 20px;
background:white;
}

.hero h1{
margin:0 0 10px;
font-size:35px;
}

.hero p{
color:#6b7280;
}

.container{
max-width:1100px;
margin:30px auto;
padding:0 15px;
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}

.topbar h2{
margin:0;
}

.refresh{
border:0;
background:#2563eb;
color:white;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.status{
padding:15px;
background:white;
border-radius:10px;
margin-bottom:20px;
text-align:center;
}

.packages{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:18px;
}

.card{
background:white;
border-radius:14px;
padding:20px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h3{
margin-top:0;
}

.price{
font-size:21px;
font-weight:bold;
color:#2563eb;
margin:12px 0;
}

.buy{
width:100%;
padding:12px;
border:0;
border-radius:9px;
background:#16a34a;
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.buy:hover{
background:#15803d;
}

footer{
margin-top:50px;
padding:25px;
background:#111827;
color:white;
text-align:center;
}

@media(max-width:700px){

header{
flex-wrap:wrap;
}

.nav{
width:100%;
justify-content:flex-end;
}

.hero h1{
font-size:28px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
SHOPACCGAME
</div>

<div class="nav">

<a href="index.html">
Trang chủ
</a>

<div class="customer-area">

<button
class="customer-button"
onclick="toggleCustomerMenu()"
>
👤 <span id="customerName">Khách hàng</span> ▾
</button>

<div
id="customerMenu"
class="customer-menu"
>

<div class="customer-title">
👤 Tài khoản khách hàng
</div>

<div class="customer-info">
Tài khoản:
<b id="menuUsername">Chưa đăng nhập</b>
</div>

<div class="customer-info">
💰 Số dư:
<b id="menuBalance">0đ</b>
</div>

<button onclick="viewMyAccounts()">
📦 Thông tin acc đã mua
</button>

<button onclick="goLogin()">
🔐 Đăng nhập
</button>

<button
class="logout-button"
onclick="logoutCustomer()"
>
🚪 Đăng xuất
</button>

</div>

</div>

</div>

</header>
<section class="hero">

<h1>🎮 SHOPACCGAME</h1>

<p>
Shop bán tài khoản game nhanh chóng và tiện lợi
</p>

</section>


<div class="container">

<div
id="status"
class="status"
>
Đang tải kho acc...
</div>


<div class="topbar">

<h2>
🔥 Kho tài khoản
</h2>

<button
class="refresh"
onclick="loadAccounts()"
>
🔄 Làm mới
</button>

</div>


<div
id="packages"
class="packages"
></div>

</div>


<footer>
© 2026 SHOPACCGAME
</footer>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyrF_FUCu_yCPEf9TL-140ElpNZqdrUy6yGnWpAUvBB5W00jJu3Xw4Mfne2Jd5IIfBDgA/exec";


let selectedPrice=0;

let selectedPackage="";


function getCurrentCustomer(){

return (
localStorage.getItem("currentUser") ||
localStorage.getItem("username") ||
localStorage.getItem("user") ||
""
).trim();

}


function toggleCustomerMenu(){

document
.getElementById("customerMenu")
.classList.toggle("show");

}


function goLogin(){

window.location.href="login.html";

}


function logoutCustomer(){

localStorage.removeItem("currentUser");

localStorage.removeItem("username");

localStorage.removeItem("user");

localStorage.removeItem("adminUser");

localStorage.removeItem("isAdmin");

window.location.reload();

}


function viewMyAccounts(){

const username=
getCurrentCustomer();

if(!username){

alert(
"Bạn chưa đăng nhập!"
);

window.location.href=
"login.html";

return;

}

window.location.href=
"khach-hang.html";

}


function money(number){

return Number(number||0)
.toLocaleString("vi-VN")+"đ";

}


async function updateCustomer(){

const username=
getCurrentCustomer();


const name=
document.getElementById(
"customerName"
);

const menuUsername=
document.getElementById(
"menuUsername"
);

const menuBalance=
document.getElementById(
"menuBalance"
);


if(!username){

name.textContent=
"Khách hàng";

menuUsername.textContent=
"Chưa đăng nhập";

menuBalance.textContent=
"0đ";

return;

}


name.textContent=
username;

menuUsername.textContent=
username;


try{

const response=
await fetch(
API_URL+
"?action=getBalance&username="+
encodeURIComponent(username)
);


const data=
await response.json();


if(data.ok){

menuBalance.textContent=
money(data.balance);

}

}catch(error){

console.log(error);

}

}


async function loadAccounts(){

const status=
document.getElementById(
"status"
);

const packages=
document.getElementById(
"packages"
);


status.textContent=
"Đang tải kho acc...";

packages.innerHTML="";


try{

const response=
await fetch(
API_URL+
"?action=getAccounts"
);


const data=
await response.json();


if(!data.ok){

status.textContent=
data.message||
"Không tải được kho acc";

return;

}


const accounts=
(data.accounts||[]).filter(
account=>
String(
account.status
).trim().toUpperCase()
==="CON_HANG"
);


if(accounts.length===0){

status.textContent=
"Kho hiện đang hết acc.";

return;

}


status.textContent=
"Kho đang có "+
accounts.length+
" tài khoản.";


accounts.forEach(
function(account){

const card=
document.createElement(
"div"
);

card.className=
"card";


const title=
document.createElement(
"h3"
);

title.textContent=
"🎁 Gói "+
account.package;


const label=
document.createElement(
"div"
);

label.textContent=
"Mệnh giá:";


const price=
document.createElement(
"div"
);

price.className=
"price";

price.textContent=
money(account.price);


const button=
document.createElement(
"button"
);

button.className=
"buy";

button.textContent=
"🛒 Mua ngay";


button.onclick=
function(){

buyAccount(
Number(account.price),
String(account.package)
);

};


card.appendChild(title);

card.appendChild(label);

card.appendChild(price);

card.appendChild(button);

packages.appendChild(card);

});

}catch(error){

console.error(error);

status.textContent=
"Không kết nối được Apps Script.";

}

}


function buyAccount(
price,
packageNumber
){

const username=
getCurrentCustomer();


if(!username){

alert(
"Bạn cần đăng nhập trước khi mua acc!"
);

window.location.href=
"login.html";

return;

}


selectedPrice=
Number(price);

selectedPackage=
String(packageNumber);


const ok=
confirm(
"Mua gói "+
selectedPackage+
" giá "+
money(selectedPrice)+
"?");

if(!ok)return;


purchaseAccount(username);

}

</script>
<script>

async function purchaseAccount(
username
){

try{

const response=
await fetch(
API_URL,
{
method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"getAccount",

username:username,

price:selectedPrice,

package:selectedPackage

})

}
);


const data=
await response.json();


if(!data.ok){

alert(
data.message||
"Mua acc thất bại!"
);

return;

}


alert(
"MUA ACC THÀNH CÔNG!\n\n"+
"Mã đơn: "+
data.orderId+
"\nTên acc: "+
data.accountName+
"\nMật khẩu: "+
data.accountPass+
"\nSố dư còn lại: "+
money(data.balance)
);


updateCustomer();

loadAccounts();


}catch(error){

console.error(error);

alert(
"Không kết nối được Apps Script!"
);

}

}


document.addEventListener(
"click",
function(event){

const area=
document.querySelector(
".customer-area"
);

const menu=
document.getElementById(
"customerMenu"
);


if(
area &&
menu &&
!area.contains(event.target)
){

menu.classList.remove(
"show"
);

}

});


document.addEventListener(
"DOMContentLoaded",
function(){

updateCustomer();

loadAccounts();

});


</script>

</body>
</html>
