<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giao Acc - Shop Karot</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
    color:#182238;
}

header{
    background:linear-gradient(90deg,#5137df,#347bf0);
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
}

.container{
    max-width:600px;
    margin:35px auto;
    padding:15px;
}

.box{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 5px 20px #0002;
}

.package{
    text-align:center;
    background:#f3f5fa;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

.package-price{
    font-size:27px;
    font-weight:bold;
    color:#5137df;
}

.info{
    background:#f5f7fb;
    padding:16px;
    border-radius:10px;
    margin:12px 0;
}

.label{
    color:#777;
    font-size:14px;
    margin-bottom:6px;
}

.value{
    font-size:20px;
    font-weight:bold;
    word-break:break-all;
}

.copy{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#5137df;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#5137df;
    text-decoration:none;
}

.warning{
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    background:#fff3cd;
    color:#735a16;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <h1>🎮 SHOP KAROT</h1>
    <p>Thông tin tài khoản</p>
</header>


<div class="container">

<div class="box">

    <div class="package">

        <h2 id="packageName">
            Gói
        </h2>

        <div
            class="package-price"
            id="packagePrice">
            0K
        </div>

    </div>


    <div class="info">

        <div class="label">
            👤 Name
        </div>

        <div
            class="value"
            id="accountName">
            ---
        </div>

    </div>


    <div class="info">

        <div class="label">
            🔑 Pass
        </div>

        <div
            class="value"
            id="accountPass">
            ---
        </div>

    </div>


    <button
        class="copy"
        onclick="copyAccount()">

        📋 Sao chép Name + Pass

    </button>


    <div class="warning">

        ⚠️ Đây là dữ liệu demo.
        Không đưa mật khẩu tài khoản thật
        vào GitHub Public.

    </div>


    <a
        class="back"
        href="tui-mu.html">

        ← Chọn gói khác

    </a>

</div>

</div>


<script>

    gói 1
    gói 2
    ...
    gói 8

Các Name + Pass dưới đây là DỮ LIỆU MẪU.
*/

    },

    {

};


/*
==================================================
ĐỌC LINK
==================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );


const price =
    params.get("price");


const packageNumber =
    Number(
        params.get("package")
    );


/*
==================================================
HIỂN THỊ GÓI
==================================================
*/

const priceNames = {

    "0":"0K",

    "10000":"10K",

    "20000":"20K",

    "80000":"80K",

    "50000":"50K",

    "100000":"100K"

};


const priceText =
    priceNames[price] || "Không xác định";


document.getElementById(
    "packageName"
).textContent =
    "🎁 Gói " + packageNumber;


document.getElementById(
    "packagePrice"
).textContent =
    priceText;


/*
==================================================
LẤY ACC
==================================================
*/

const list =
    ACCOUNTS[price];


const account =
    list &&
    list[packageNumber - 1];


if(account){

    document.getElementById(
        "accountName"
    ).textContent =
        account.name;


    document.getElementById(
        "accountPass"
    ).textContent =
        account.pass;

}else{

    document.getElementById(
        "accountName"
    ).textContent =
        "Không tìm thấy";


    document.getElementById(
        "accountPass"
    ).textContent =
        "---";

}


/*
==================================================
COPY
==================================================
*/

function copyAccount(){

    if(!account){

        alert(
            "❌ Không có thông tin acc."
        );

        return;

    }


    const text =
        "Name: "
        + account.name
        + "\nPass: "
        + account.pass;


    navigator.clipboard
        .writeText(text)
        .then(function(){

            alert(
                "✅ Đã sao chép Name + Pass!"
            );

        });

}

</script>

</body>
</html>
