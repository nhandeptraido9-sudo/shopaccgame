<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thông tin Acc Blox Fruits</title>

<style>
body{
  margin:0;
  background:#eef3f8;
  font-family:Arial,sans-serif;
  color:#172033;
}

.box{
  max-width:600px;
  margin:45px auto;
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 5px 25px #0002;
}

.info{
  padding:15px;
  margin:10px 0;
  background:#f4f7fb;
  border-radius:10px;
}

.account{
  margin-top:20px;
  padding:20px;
  background:#ecfdf3;
  border-radius:12px;
}

.copy{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.back{
  display:inline-block;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>🎮 Thông tin Acc Blox Fruits</h1>

<div class="info">
🎁 Gói túi:
<b id="bag">-</b>
</div>

<div class="info">
💰 Mệnh giá:
<b id="price">-</b>
</div>

<div class="account">

<h3>✅ Acc của bạn</h3>

<p>
👤 Username:
<b id="username">-</b>
</p>

<p>
🔑 Password:
<b id="password">-</b>
</p>

<button class="copy" onclick="copyAccount()">
📋 SAO CHÉP THÔNG TIN
</button>

</div>

<a class="back" href="index.html">
← Về shop
</a>

</div>

<script>

const q = new URLSearchParams(location.search);

const bag = q.get("bag") || "1";
const price = Number(q.get("price") || 0);

document.getElementById("bag").textContent =
"Túi số " + bag;

document.getElementById("price").textContent =
price.toLocaleString("vi-VN") + " ₫";


/*
==================================================
MỖI GÓI + MỆNH GIÁ = MỘT ACC KHÁC NHAU
==================================================

Key có dạng:

"TÚI_MỆNHGIÁ"

Ví dụ:

"1_0"       = Túi 1 - 0đ
"1_10000"   = Túi 1 - 10K
"2_10000"   = Túi 2 - 10K
"8_20000"   = Túi 8 - 20K
*/

const accounts = {

  /* ===== TÚI 1 ===== */

  "1_0":{
    username:"bvcbcvb",
    password:"shoprobloxK"
  },

  "1_10000":{
    username:"DEMO_1_10K",
    password:"PASS_1_10K"
  },

  "1_20000":{
    username:"DEMO_1_20K",
    password:"PASS_1_20K"
  },


  /* ===== TÚI 2 ===== */

  "2_0":{
    username:"DEMO_2_0K",
    password:"PASS_2_0K"
  },

  "2_10000":{
    username:"DEMO_2_10K",
    password:"PASS_2_10K"
  },

  "2_20000":{
    username:"DEMO_2_20K",
    password:"PASS_2_20K"
  },


  /* ===== TÚI 3 ===== */

  "3_0":{
    username:"DEMO_3_0K",
    password:"PASS_3_0K"
  },

  "3_10000":{
    username:"DEMO_3_10K",
    password:"PASS_3_10K"
  },

  "3_20000":{
    username:"DEMO_3_20K",
    password:"PASS_3_20K"
  },


  /* ===== TÚI 4 ===== */

  "4_0":{
    username:"DEMO_4_0K",
    password:"PASS_4_0K"
  },

  "4_10000":{
    username:"DEMO_4_10K",
    password:"PASS_4_10K"
  },

  "4_20000":{
    username:"DEMO_4_20K",
    password:"PASS_4_20K"
  },


  /* ===== TÚI 5 ===== */

  "5_0":{
    username:"DEMO_5_0K",
    password:"PASS_5_0K"
  },

  "5_10000":{
    username:"DEMO_5_10K",
    password:"PASS_5_10K"
  },

  "5_20000":{
    username:"DEMO_5_20K",
    password:"PASS_5_20K"
  },


  /* ===== TÚI 6 ===== */

  "6_0":{
    username:"DEMO_6_0K",
    password:"PASS_6_0K"
  },

  "6_10000":{
    username:"DEMO_6_10K",
    password:"PASS_6_10K"
  },

  "6_20000":{
    username:"DEMO_6_20K",
    password:"PASS_6_20K"
  },


  /* ===== TÚI 7 ===== */

  "7_0":{
    username:"DEMO_7_0K",
    password:"PASS_7_0K"
  },

  "7_10000":{
    username:"DEMO_7_10K",
    password:"PASS_7_10K"
  },

  "7_20000":{
    username:"DEMO_7_20K",
    password:"PASS_7_20K"
  },


  /* ===== TÚI 8 ===== */

  "8_0":{
    username:"DEMO_8_0K",
    password:"PASS_8_0K"
  },

  "8_10000":{
    username:"DEMO_8_10K",
    password:"PASS_8_10K"
  },

  "8_20000":{
    username:"DEMO_8_20K",
    password:"PASS_8_20K"
  }

};


/* LẤY ĐÚNG ACC */

const key = bag + "_" + price;

const account = accounts[key];


if(account){

  document.getElementById("username").textContent =
    account.username;

  document.getElementById("password").textContent =
    account.password;

}else{

  document.getElementById("username").textContent =
    "Không có acc";

  document.getElementById("password").textContent =
    "Không có acc";

}


/* COPY */

function copyAccount(){

  const username =
    document.getElementById("username").textContent;

  const password =
    document.getElementById("password").textContent;

  const text =
    "Username: " + username +
    "\nPassword: " + password;

  navigator.clipboard.writeText(text);

  alert("Đã sao chép thông tin acc!");

}

</script>

</body>
</html>
