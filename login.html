<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập - SHOPACCGAME</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:Arial,sans-serif;

    background:
        linear-gradient(
            135deg,
            #151b35,
            #4320a8
        );
}

.login-box{
    width:400px;
    max-width:92%;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    margin:0 0 8px;
    color:#202742;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}


/* TAB KHÁCH / ADMIN */

.main-tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.main-tabs button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:#edf0f7;
}

.main-tabs button.active{
    background:#5b43e8;
    color:white;
}


/* TAB ĐĂNG NHẬP / ĐĂNG KÝ */

.user-tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.user-tabs button{
    flex:1;
    padding:10px;
    border:1px solid #ddd;
    border-radius:9px;
    background:white;
    cursor:pointer;
    font-weight:bold;
}

.user-tabs button.active{
    background:#eeeafe;
    border-color:#5b43e8;
    color:#5b43e8;
}


label{
    display:block;
    margin:12px 0 6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccd2df;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#5b43e8;
}


.main-btn{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:0;
    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #6647ee,
            #3e79ee
        );

    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.main-btn:hover{
    opacity:.92;
}


.message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
    font-weight:bold;
}


.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#5b43e8;
    text-decoration:none;
}


.note{
    margin-top:20px;
    padding:10px;
    background:#fff6d8;
    border-radius:10px;
    color:#735a16;
    font-size:12px;
}

</style>

</head>


<body>


<div class="login-box">


    <h1>🎮 SHOPACCGAME</h1>

    <div class="subtitle">
        Tài khoản khách hàng
    </div>


    <!-- KHÁCH / ADMIN -->

    <div class="main-tabs">

        <button
            id="userTab"
            class="active"
            onclick="changeMainMode('user')">

            👤 Khách hàng

        </button>


        <button
            id="adminTab"
            onclick="changeMainMode('admin')">

            🛠️ Admin

        </button>

    </div>


    <!-- ĐĂNG NHẬP / ĐĂNG KÝ -->

    <div
        id="userTabs"
        class="user-tabs">

        <button
            id="loginTab"
            onclick="changeUserMode('login')">

            🔐 Đăng nhập

        </button>


        <button
            id="registerTab"
            class="active"
            onclick="changeUserMode('register')">

            📝 Tạo tài khoản

        </button>

    </div>


    <form onsubmit="submitForm(event)">


        <label>
            Tên tài khoản
        </label>


        <input
            id="username"
            type="text"
            placeholder="Nhập tên tài khoản"
            autocomplete="username"
            required
        >


        <label>
            Mật khẩu
        </label>


        <input
            id="password"
            type="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
        >


        <!-- NHẬP LẠI MẬT KHẨU -->

        <div id="registerFields">

            <label>
                Nhập lại mật khẩu
            </label>


            <input
                id="confirmPassword"
                type="password"
                placeholder="Nhập lại mật khẩu"
                autocomplete="new-password"
            >

        </div>


        <button
            id="submitButton"
            class="main-btn"
            type="submit">

            📝 Tạo tài khoản

        </button>


        <div
            id="message"
            class="message">
        </div>


    </form>


    <div class="back">

        <a href="index.html">
            ← Quay lại shop
        </a>

    </div>


    <div class="note">

        ⚠️ Đây là bản demo bằng HTML/JavaScript.
        Không dùng để lưu mật khẩu thật hoặc thông tin thanh toán.

    </div>


</div>


<script>

/* =========================
   TRẠNG THÁI
========================= */

let mainMode = "user";

let userMode = "register";


/* =========================
   CHUYỂN KHÁCH / ADMIN
========================= */

function changeMainMode(mode){

    mainMode = mode;

    document
        .getElementById("userTab")
        .classList.toggle(
            "active",
            mode === "user"
        );

    document
        .getElementById("adminTab")
        .classList.toggle(
            "active",
            mode === "admin"
        );

    const userTabs =
        document.getElementById("userTabs");

    const registerFields =
        document.getElementById("registerFields");

    const submitButton =
        document.getElementById("submitButton");

    const subtitle =
        document.querySelector(".subtitle");


    if(mode === "admin"){

        userTabs.style.display = "none";

        registerFields.style.display = "none";

        submitButton.textContent =
            "🔐 Đăng nhập Admin";

        subtitle.textContent =
            "Đăng nhập quản trị";

    }else{

        userTabs.style.display = "flex";

        subtitle.textContent =
            "Tài khoản khách hàng";

        changeUserMode(userMode);

    }

    clearMessage();

}


/* =========================
   CHUYỂN ĐĂNG NHẬP / ĐĂNG KÝ
========================= */

function changeUserMode(mode){

    userMode = mode;

    document
        .getElementById("loginTab")
        .classList.toggle(
            "active",
            mode === "login"
        );

    document
        .getElementById("registerTab")
        .classList.toggle(
            "active",
            mode === "register"
        );

    const registerFields =
        document.getElementById("registerFields");

    const submitButton =
        document.getElementById("submitButton");


    if(mode === "login"){

        registerFields.style.display =
            "none";

        submitButton.textContent =
            "🔐 Đăng nhập";

    }else{

        registerFields.style.display =
            "block";

        submitButton.textContent =
            "📝 Tạo tài khoản";

    }

    clearMessage();

}


/* =========================
   XÓA THÔNG BÁO
========================= */

function clearMessage(){

    document.getElementById(
        "message"
    ).textContent = "";

}


/* =========================
   FORM
========================= */

function submitForm(event){

    event.preventDefault();


    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if(!username || !password){

        showError(
            "❌ Vui lòng nhập đầy đủ thông tin."
        );

        return;
    }


    /* =========================
       ADMIN
    ========================= */

    if(mainMode === "admin"){

        const ADMIN_USERNAME = "admin";

        const ADMIN_PASSWORD = "123456";


        if(
            username === ADMIN_USERNAME &&
            password === ADMIN_PASSWORD
        ){

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );

            showSuccess(
                "✅ Đăng nhập Admin thành công!"
            );


            setTimeout(function(){

                window.location.href =
                    "admin.html";

            },500);


        }else{

            showError(
                "❌ Sai tài khoản hoặc mật khẩu Admin."
            );

        }

        return;
    }


    /* =========================
       LẤY USER
    ========================= */

    let users = {};


    try{

        users =
            JSON.parse(
                localStorage.getItem(
                    "shopUsers"
                ) || "{}"
            );

    }catch(error){

        users = {};

    }


    /* =========================
       ĐĂNG NHẬP
    ========================= */

    if(userMode === "login"){

        const user =
            users[username];


        if(!user){

            showError(
                "❌ Tài khoản không tồn tại."
            );

            return;
        }


        if(user.password !== password){

            showError(
                "❌ Sai mật khẩu."
            );

            return;
        }


        /*
        ================================
        ĐĂNG NHẬP THÀNH CÔNG
        ================================
        */

        localStorage.setItem(
            "currentUser",
            username
        );


        /*
        DÒNG NÀY KÍCH HOẠT POPUP
        TRÊN INDEX.HTML
        */

        localStorage.setItem(
            "login_success",
            "true"
        );


        showSuccess(
            "✅ Đăng nhập thành công!"
        );


        setTimeout(function(){

            window.location.href =
                "index.html";

        },500);


        return;
    }


    /* =========================
       ĐĂNG KÝ
    ========================= */

    const confirmPassword =
        document
        .getElementById(
            "confirmPassword"
        )
        .value;


    if(password !== confirmPassword){

        showError(
            "❌ Hai mật khẩu không giống nhau."
        );

        return;
    }


    if(users[username]){

        showError(
            "❌ Tài khoản này đã tồn tại."
        );

        return;
    }


    users[username] = {

        password:password,

        createdAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "shopUsers",
        JSON.stringify(users)
    );


    localStorage.setItem(
        "currentUser",
        username
    );


    /*
    ================================
    ĐĂNG KÝ THÀNH CÔNG
    CŨNG HIỆN POPUP
    ================================
    */

    localStorage.setItem(
        "login_success",
        "true"
    );


    showSuccess(
        "✅ Tạo tài khoản thành công!"
    );


    setTimeout(function(){

        window.location.href =
            "index.html";

    },700);

}


/* =========================
   THÔNG BÁO LỖI
========================= */

function showError(text){

    const message =
        document.getElementById("message");

    message.style.color =
        "#e53935";

    message.textContent =
        text;

}


/* =========================
   THÔNG BÁO THÀNH CÔNG
========================= */

function showSuccess(text){

    const message =
        document.getElementById("message");

    message.style.color =
        "#00a66a";

    message.textContent =
        text;

}

</script>


</body>
</html>
