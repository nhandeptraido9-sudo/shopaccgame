<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - Shop Game</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#151b35,#4320a8);
}

.login-box{
    width:380px;
    max-width:92%;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 45px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    margin:0 0 8px;
    color:#202742;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.tabs button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:#edf0f7;
}

.tabs button.active{
    background:#5b43e8;
    color:white;
}

label{
    display:block;
    margin:12px 0 6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccd2df;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#5b43e8;
}

.main-btn{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:linear-gradient(90deg,#6647ee,#3e79ee);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
}

.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#5b43e8;
    text-decoration:none;
}

.note{
    margin-top:20px;
    padding:10px;
    background:#fff6d8;
    border-radius:10px;
    color:#735a16;
    font-size:12px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>🎮 SHOP GAME</h1>
    <div class="subtitle">Đăng nhập tài khoản</div>

    <div class="tabs">
        <button id="userTab"
                class="active"
                onclick="changeMode('user')">
            👤 Khách hàng
        </button>

        <button id="adminTab"
                onclick="changeMode('admin')">
            🛠️ Admin
        </button>
    </div>

    <form onsubmit="login(event)">

        <label>Tên tài khoản</label>

        <input
            id="username"
            type="text"
            placeholder="Nhập tên tài khoản"
            required
        >

        <label>Mật khẩu</label>

        <input
            id="password"
            type="password"
            placeholder="Nhập mật khẩu"
            required
        >

        <div id="registerFields">

            <label>Nhập lại mật khẩu</label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Nhập lại mật khẩu"
            >

        </div>

        <button
            id="submitButton"
            class="main-btn"
            type="submit">
            Đăng ký tài khoản
        </button>

        <div
            id="message"
            class="message">
        </div>

    </form>

    <div class="back">
        <a href="index.html">← Quay lại shop</a>
    </div>

    <div class="note">
        ⚠️ Đây là bản demo bằng HTML/JavaScript.
        Không dùng để lưu mật khẩu thật hoặc thông tin thanh toán.
    </div>

</div>


<script>

let mode = "user";


function changeMode(newMode){

    mode = newMode;

    document
        .getElementById("userTab")
        .classList.toggle(
            "active",
            mode === "user"
        );

    document
        .getElementById("adminTab")
        .classList.toggle(
            "active",
            mode === "admin"
        );

    const registerFields =
        document.getElementById("registerFields");

    const submitButton =
        document.getElementById("submitButton");

    if(mode === "admin"){

        registerFields.style.display = "none";

        submitButton.textContent =
            "🔐 Đăng nhập Admin";

    }else{

        registerFields.style.display = "block";

        submitButton.textContent =
            "📝 Đăng ký tài khoản";
    }

    document.getElementById("message").textContent = "";
}


function login(event){

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    /* =========================
       ĐĂNG NHẬP ADMIN
       ========================= */

    if(mode === "admin"){

        /*
          TÀI KHOẢN DEMO

          Username: admin
          Password: 123456

          Hãy đổi khi thử nghiệm.
        */

        const ADMIN_USERNAME = "admin";
        const ADMIN_PASSWORD = "123456";


        if(
            username === ADMIN_USERNAME &&
            password === ADMIN_PASSWORD
        ){

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );

            message.style.color = "#00a66a";

            message.textContent =
                "✅ Đăng nhập Admin thành công!";


            setTimeout(function(){

                window.location.href =
                    "admin.html";

            },500);

        }else{

            message.style.color = "#e53935";

            message.textContent =
                "❌ Sai tài khoản hoặc mật khẩu Admin.";
        }

        return;
    }


    /* =========================
       ĐĂNG KÝ KHÁCH HÀNG
       ========================= */

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    if(password !== confirmPassword){

        message.style.color = "#e53935";

        message.textContent =
            "❌ Hai mật khẩu không giống nhau.";

        return;
    }


    let users =
        JSON.parse(
            localStorage.getItem("shopUsers") || "{}"
        );


    if(users[username]){

        message.style.color = "#e53935";

        message.textContent =
            "❌ Tài khoản này đã tồn tại.";

        return;
    }


    users[username] = {

        password: password,

        createdAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "shopUsers",
        JSON.stringify(users)
    );


    localStorage.setItem(
        "currentUser",
        username
    );


    message.style.color = "#00a66a";

    message.textContent =
        "✅ Đăng ký thành công!";


    setTimeout(function(){

        window.location.href =
            "index.html";

    },700);
}

</script>

</body>
</html>
