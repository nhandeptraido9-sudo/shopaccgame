<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập - SHOPACCGAME</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#111827;
color:white;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin-left:10px;
padding:9px 12px;
border-radius:8px;
}

nav a:hover{
background:#2563eb;
}

.container{
width:100%;
max-width:430px;
margin:45px auto;
padding:15px;
}

.box{
background:white;
padding:28px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-top:0;
}

.tabs{
display:flex;
gap:8px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:12px;
border:0;
border-radius:9px;
cursor:pointer;
font-weight:bold;
background:#e5e7eb;
}

.tab.active{
background:#2563eb;
color:white;
}

.form{
display:none;
}

.form.active{
display:block;
}

label{
display:block;
font-weight:bold;
margin-top:14px;
}

input{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

button.submit{
width:100%;
margin-top:20px;
padding:13px;
border:0;
border-radius:9px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button.submit:hover{
background:#1d4ed8;
}

.register{
background:#16a34a !important;
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:8px;
text-align:center;
}

.success{
display:block;
background:#dcfce7;
color:#166534;
}

.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

footer{
margin-top:auto;
background:#111827;
color:white;
text-align:center;
padding:20px;
}
</style>
</head>

<body>

<header>

<div class="logo">
SHOPACCGAME
</div>

<nav>
<a href="index.html">🏠 Trang chủ</a>
</nav>

</header>

<div class="container">

<div class="box">

<h1>🔐 Đăng nhập</h1>

<div class="tabs">

<button
class="tab active"
onclick="showForm('customer')"
id="customerTab"
>
👤 Khách hàng
</button>

<button
class="tab"
onclick="showForm('admin')"
id="adminTab"
>
🛡️ Admin
</button>

</div>
<!-- =========================
     KHÁCH HÀNG
========================= -->

<div
id="customerForm"
class="form active"
>

<label>
Tên tài khoản
</label>

<input
id="customerUsername"
type="text"
placeholder="Nhập tên tài khoản"
>

<label>
Mật khẩu
</label>

<input
id="customerPassword"
type="password"
placeholder="Nhập mật khẩu"
>

<button
class="submit"
onclick="customerLogin()"
>
Đăng nhập khách hàng
</button>

<button
class="submit register"
onclick="customerRegister()"
>
Đăng ký tài khoản
</button>

</div>


<!-- =========================
     ADMIN
========================= -->

<div
id="adminForm"
class="form"
>

<label>
Tên Admin
</label>

<input
id="adminUsername"
type="text"
placeholder="Tên Admin"
>

<label>
Mật khẩu Admin
</label>

<input
id="adminPassword"
type="password"
placeholder="Mật khẩu Admin"
>

<button
class="submit"
onclick="adminLogin()"
>
🛡️ Đăng nhập Admin
</button>

</div>


<div
id="message"
class="message"
></div>

</div>

</div>


<footer>
© 2026 SHOPACCGAME
</footer>
