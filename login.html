<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập - SHOPACCGAME</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#111827;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

header a{
    color:white;
    text-decoration:none;
    padding:9px 13px;
    border-radius:8px;
}

header a:hover{
    background:#2563eb;
}

.container{
    width:100%;
    max-width:440px;
    margin:45px auto;
    padding:15px;
}

.box{
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-top:0;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    padding:12px;
    border:0;
    border-radius:9px;
    background:#e5e7eb;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.tab.active{
    background:#2563eb;
    color:white;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;
    margin-top:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    margin-top:6px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button.submit{
    width:100%;
    padding:13px;
    margin-top:20px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button.submit:hover{
    background:#1d4ed8;
}

.register{
    background:#16a34a !important;
}

.admin-button{
    background:#dc2626 !important;
}

.admin-button:hover{
    background:#b91c1c !important;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    text-align:center;
    font-weight:bold;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

footer{
    margin-top:auto;
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<header>

<div class="logo">
SHOPACCGAME
</div>

<a href="index.html">
🏠 Trang chủ
</a>

</header>

<div class="container">

<div class="box">

<h1>🔐 Đăng nhập</h1>

<div class="tabs">

<button
type="button"
class="tab active"
id="customerTab"
onclick="showForm('customer')"
>
👤 Khách hàng
</button>

<button
type="button"
class="tab"
id="adminTab"
onclick="showForm('admin')"
>
🛡️ Admin
</button>

</div>
<!-- ================= KHÁCH HÀNG ================= -->

<div
id="customerForm"
class="form active"
>

<label>
Tên tài khoản
</label>

<input
type="text"
id="customerUsername"
placeholder="Nhập tên tài khoản"
autocomplete="username"
>

<label>
Mật khẩu
</label>

<input
type="password"
id="customerPassword"
placeholder="Nhập mật khẩu"
autocomplete="current-password"
>

<button
type="button"
class="submit"
onclick="customerLogin()"
>
👤 Đăng nhập khách hàng
</button>

<button
type="button"
class="submit register"
onclick="customerRegister()"
>
📝 Đăng ký tài khoản
</button>

</div>


<!-- ================= ADMIN ================= -->

<div
id="adminForm"
class="form"
>

<label>
Tên Admin
</label>

<input
type="text"
id="adminUsername"
placeholder="Nhập tên Admin"
autocomplete="username"
>

<label>
Mật khẩu Admin
</label>

<input
type="password"
id="adminPassword"
placeholder="Nhập mật khẩu Admin"
autocomplete="current-password"
>

<button
type="button"
class="submit admin-button"
onclick="adminLogin()"
>
🛡️ Đăng nhập Admin
</button>

</div>


<div
id="message"
class="message"
></div>

</div>

</div>

<footer>
© 2026 SHOPACCGAME
</footer>
<script>

/* =========================================
   LINK APPS SCRIPT MỚI
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbyrF_FUCu_yCPEf9TL-140ElpNZqdrUy6yGnWpAUvBB5W00jJu3Xw4Mfne2Jd5IIfBDgA/exec";


/* =========================================
   CHUYỂN KHÁCH / ADMIN
========================================= */

function showForm(type){

    const customerForm =
        document.getElementById("customerForm");

    const adminForm =
        document.getElementById("adminForm");

    const customerTab =
        document.getElementById("customerTab");

    const adminTab =
        document.getElementById("adminTab");

    customerForm.classList.remove("active");
    adminForm.classList.remove("active");

    customerTab.classList.remove("active");
    adminTab.classList.remove("active");

    clearMessage();

    if(type === "customer"){

        customerForm.classList.add("active");
        customerTab.classList.add("active");

    }else{

        adminForm.classList.add("active");
        adminTab.classList.add("active");

    }
}


/* =========================================
   THÔNG BÁO
========================================= */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;
}

function clearMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className = "message";
}


/* =========================================
   LẤY TÀI KHOẢN KHÁCH
========================================= */

function getUsers(){

    try{

        return JSON.parse(
            localStorage.getItem("shopUsers")
        ) || {};

    }catch(error){

        return {};

    }
}


/* =========================================
   ĐĂNG KÝ KHÁCH
========================================= */

function customerRegister(){

    const username =
        document
        .getElementById("customerUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("customerPassword")
        .value;

    if(username.length < 3){

        showMessage(
            "Tên tài khoản phải có ít nhất 3 ký tự",
            "error"
        );

        return;
    }

    if(password.length < 4){

        showMessage(
            "Mật khẩu phải có ít nhất 4 ký tự",
            "error"
        );

        return;
    }

    const users = getUsers();

    const key =
        username.toLowerCase();

    if(users[key]){

        showMessage(
            "Tài khoản đã tồn tại",
            "error"
        );

        return;
    }

    users[key] = {
        username:username,
        password:password
    };

    localStorage.setItem(
        "shopUsers",
        JSON.stringify(users)
    );

    showMessage(
        "Đăng ký thành công! Hãy đăng nhập.",
        "success"
    );
}


/* =========================================
   ĐĂNG NHẬP KHÁCH
========================================= */

function customerLogin(){

    const username =
        document
        .getElementById("customerUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("customerPassword")
        .value;

    if(!username || !password){

        showMessage(
            "Vui lòng nhập đầy đủ tài khoản và mật khẩu",
            "error"
        );

        return;
    }

    const users = getUsers();

    const key =
        username.toLowerCase();

    const user = users[key];

    if(!user){

        showMessage(
            "Tài khoản không tồn tại. Hãy đăng ký trước.",
            "error"
        );

        return;
    }

    if(user.password !== password){

        showMessage(
            "Sai mật khẩu",
            "error"
        );

        return;
    }

    /*
       LƯU TÊN KHÁCH ĐỂ INDEX CŨ
       CÓ THỂ ĐỌC ĐƯỢC
    */

    localStorage.setItem(
        "currentUser",
        user.username
    );

    localStorage.setItem(
        "username",
        user.username
    );

    localStorage.setItem(
        "user",
        user.username
    );

    localStorage.setItem(
        "taikhoan",
        user.username
    );

    showMessage(
        "Đăng nhập thành công!",
        "success"
    );

    setTimeout(function(){

        window.location.href =
            "index.html";

    },700);
}


/* =========================================
   ĐĂNG NHẬP ADMIN
========================================= */

async function adminLogin(){

    const username =
        document
        .getElementById("adminUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("adminPassword")
        .value;

    if(!username || !password){

        showMessage(
            "Vui lòng nhập tên Admin và mật khẩu",
            "error"
        );

        return;
    }

    showMessage(
        "Đang kiểm tra Admin...",
        "success"
    );

    try{

        const response =
            await fetch(API_URL,{
                method:"POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:JSON.stringify({

                    action:"adminLogin",

                    username:username,

                    password:password

                })
            });

        const data =
            await response.json();

        if(!data.ok){

            showMessage(
                data.message ||
                "Đăng nhập Admin thất bại",
                "error"
            );

            return;
        }

        /*
           LƯU PHIÊN ADMIN
        */

        localStorage.setItem(
            "adminUser",
            data.username || username
        );

        localStorage.setItem(
            "adminToken",
            data.token || ""
        );

        localStorage.setItem(
            "isAdmin",
            "true"
        );

        showMessage(
            "Đăng nhập Admin thành công!",
            "success"
        );

        setTimeout(function(){

            window.location.href =
                "admin.html";

        },700);

    }catch(error){

        console.error(error);

        showMessage(
            "Không kết nối được Apps Script. Hãy kiểm tra Web App đã Deploy phiên bản mới chưa.",
            "error"
        );
    }
}


/* =========================================
   ENTER ĐỂ ĐĂNG NHẬP
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Enter"){
            return;
        }

        const adminForm =
            document
            .getElementById("adminForm");

        if(adminForm.classList.contains("active")){

            adminLogin();

        }else{

            customerLogin();

        }
    }
);

</script>

</body>
</html>
