<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập - SHOPACCGAME</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#111827;
color:white;
padding:15px 25px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:22px;
font-weight:bold;
}

.menu{
display:flex;
gap:8px;
}

.menu a{
color:white;
text-decoration:none;
padding:10px 13px;
border-radius:8px;
font-weight:bold;
}

.menu a:hover{
background:#2563eb;
}

.container{
width:100%;
max-width:430px;
margin:50px auto;
padding:20px;
}

.box{
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-top:0;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:13px;
margin-top:7px;
border:1px solid #ddd;
border-radius:9px;
font-size:16px;
}

button{
width:100%;
padding:13px;
margin-top:20px;
border:0;
border-radius:9px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.register{
background:#16a34a;
}

.message{
margin-top:15px;
padding:12px;
border-radius:8px;
display:none;
text-align:center;
}

.success{
background:#dcfce7;
color:#166534;
}

.error{
background:#fee2e2;
color:#991b1b;
}

.user-info{
margin-top:20px;
text-align:center;
display:none;
}

.user-info button{
background:#dc2626;
}

footer{
margin-top:auto;
background:#111827;
color:white;
text-align:center;
padding:20px;
}
</style>
</head>

<body>

<header>

<div class="logo">
SHOPACCGAME
</div>

<nav class="menu">

<a href="index.html">
🏠 Trang chủ
</a>

<a href="tui-mu.html">
🎁 Túi mù
</a>

</nav>

</header>
<div class="container">

<div class="box">

<h1>
👤 Đăng nhập
</h1>

<label>
Tên tài khoản
</label>

<input
type="text"
id="username"
placeholder="Nhập tên tài khoản"
autocomplete="username"
>

<label>
Mật khẩu
</label>

<input
type="password"
id="password"
placeholder="Nhập mật khẩu"
autocomplete="current-password"
>

<button onclick="login()">
Đăng nhập
</button>

<button
class="register"
onclick="register()"
>
Đăng ký tài khoản
</button>

<div
id="message"
class="message"
></div>

<div
id="userInfo"
class="user-info"
>

<div>
Đang đăng nhập:
<strong id="loggedUser"></strong>
</div>

<button onclick="logout()">
Đăng xuất
</button>

</div>

</div>

</div>


<footer>
© 2026 SHOPACCGAME
</footer>
<script>

function showMessage(text,type){

const box =
document.getElementById("message");

box.textContent=text;

box.className=
"message " + type;

box.style.display="block";

}


function getUsers(){

try{

return JSON.parse(
localStorage.getItem("shopUsers")
) || {};

}catch(e){

return {};

}

}


function register(){

const username =
document.getElementById("username")
.value.trim();

const password =
document.getElementById("password")
.value;

if(!username){

showMessage(
"Vui lòng nhập tên tài khoản",
"error"
);

return;

}

if(username.length < 3){

showMessage(
"Tên tài khoản phải có ít nhất 3 ký tự",
"error"
);

return;

}

if(!password){

showMessage(
"Vui lòng nhập mật khẩu",
"error"
);

return;

}

if(password.length < 4){

showMessage(
"Mật khẩu phải có ít nhất 4 ký tự",
"error"
);

return;

}


const users =
getUsers();

const key =
username.toLowerCase();


if(users[key]){

showMessage(
"Tài khoản đã tồn tại",
"error"
);

return;

}


users[key]={
username:username,
password:password
};

localStorage.setItem(
"shopUsers",
JSON.stringify(users)
);


showMessage(
"Đăng ký thành công! Bạn có thể đăng nhập.",
"success"
);

}


function login(){

const username =
document.getElementById("username")
.value.trim();

const password =
document.getElementById("password")
.value;


if(!username || !password){

showMessage(
"Vui lòng nhập đầy đủ tài khoản và mật khẩu",
"error"
);

return;

}


const users =
getUsers();

const key =
username.toLowerCase();

const user =
users[key];


if(!user){

showMessage(
"Tài khoản không tồn tại. Hãy đăng ký trước.",
"error"
);

return;

}


if(user.password !== password){

showMessage(
"Sai mật khẩu",
"error"
);

return;

}


/*
ĐỒNG BỘ TÊN KHÁCH
CHO TOÀN BỘ SHOP
*/

localStorage.setItem(
"currentUser",
user.username
);

localStorage.setItem(
"username",
user.username
);

localStorage.setItem(
"user",
user.username
);

localStorage.setItem(
"taikhoan",
user.username
);


showMessage(
"Đăng nhập thành công!",
"success"
);


setTimeout(function(){

window.location.href =
"index.html";

},800);

}


function logout(){

localStorage.removeItem(
"currentUser"
);

localStorage.removeItem(
"username"
);

localStorage.removeItem(
"user"
);

localStorage.removeItem(
"taikhoan"
);

document.getElementById(
"userInfo"
).style.display="none";

showMessage(
"Đã đăng xuất",
"success"
);

}


function checkLogin(){

const username =
localStorage.getItem(
"currentUser"
);

if(username){

document.getElementById(
"loggedUser"
).textContent=
username;

document.getElementById(
"userInfo"
).style.display="block";

}

}


document.addEventListener(
"DOMContentLoaded",
function(){

checkLogin();

}
);

</script>

</body>
</html>
