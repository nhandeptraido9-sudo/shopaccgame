```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - SHOPACCGAME</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#111827,#2563eb);
}

.login-box{
    width:350px;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    margin-top:0;
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.message{
    text-align:center;
    margin-top:12px;
    color:#dc2626;
}

.register{
    text-align:center;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="login-box">

<h1>🔐 ĐĂNG NHẬP</h1>

<input
    type="text"
    id="username"
    placeholder="Tên đăng nhập"
>

<input
    type="password"
    id="password"
    placeholder="Mật khẩu"
>

<button onclick="login()">
    ĐĂNG NHẬP
</button>

<div id="message" class="message"></div>

<div class="register">
    Chưa có tài khoản?
    <a href="register.html">Đăng ký</a>
</div>

</div>

<script>
function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if(!username || !password){
        message.textContent =
            "Vui lòng nhập đầy đủ thông tin!";
        return;
    }

    /*
      Hệ thống demo.
      Nếu bạn đang dùng Apps Script cũ,
      thay phần kiểm tra này bằng API Apps Script của bạn.
    */

    const savedUser =
        localStorage.getItem("shop_username");

    const savedPass =
        localStorage.getItem("shop_password");

    if(savedUser === username && savedPass === password){

        localStorage.setItem(
            "shop_logged_in",
            "true"
        );

        localStorage.setItem(
            "shop_current_user",
            username
        );

        window.location.href = "index.html";

    }else{

        message.textContent =
            "Sai tài khoản hoặc mật khẩu!";

    }
}
</script>

</body>
</html>
