<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh toán</title>
<style>
body{margin:0;background:#eef3f8;font-family:Arial;color:#172033}.box{max-width:600px;margin:45px auto;background:white;border-radius:18px;padding:25px;box-shadow:0 5px 25px #0002}.row{padding:14px;margin:10px 0;background:#f4f7fb;border-radius:10px}.pay{width:100%;padding:13px;border:0;border-radius:10px;background:#168ef2;color:white;font-weight:bold;font-size:16px;cursor:pointer}.back{display:inline-block;margin-top:15px}.note{font-size:13px;color:#667085}
</style></head><body>
<div class="box"><h1>🧾 Xác nhận đơn hàng</h1>
<div class="row">Sản phẩm: <b>Túi Mù Blox Fruits</b></div>
<div class="row">Túi đã chọn: <b id="bag">-</b></div>
<div class="row">Số tiền: <b id="price">-</b></div>
<h3>Phương thức thanh toán</h3>
<div class="row">💳 Chuyển khoản ngân hàng</div>
<div class="row">📱 Ví điện tử</div>
<button class="pay" onclick="alert('Đây là bước mẫu. Cần kết nối hệ thống thanh toán/backend trước khi nhận tiền thật.')">TIẾP TỤC THANH TOÁN</button>
<a class="back" href="index.html">← Về shop</a>
<p class="note">Trang này hiện chỉ là giao diện mẫu, chưa tự động nhận hoặc xác minh thanh toán.</p>
</div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('bag').textContent='Túi số '+(q.get('bag')||'-');
document.getElementById('price').textContent=Number(q.get('price')||0).toLocaleString('vi-VN')+' ₫';
</script></body></html>
