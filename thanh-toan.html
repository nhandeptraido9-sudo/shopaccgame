<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanh toán</title>

<style>
body{
  margin:0;
  background:#eef3f8;
  font-family:Arial,sans-serif;
  color:#172033;
}

.box{
  max-width:600px;
  margin:40px auto;
  padding:25px;
  background:white;
  border-radius:18px;
  box-shadow:0 5px 25px #0002;
}

.info{
  padding:14px;
  margin:10px 0;
  background:#f4f7fb;
  border-radius:10px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#168ef2;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.free{
  background:#16a34a;
}

.wait{
  display:none;
  margin-top:15px;
  padding:15px;
  background:#fff7ed;
  border-radius:10px;
  text-align:center;
}
</style>
</head>

<body>

<div class="box">

<h1>🧾 Thanh toán</h1>

<div class="info">
🎁 Túi: <b id="bag">-</b>
</div>

<div class="info">
💰 Mệnh giá: <b id="price">-</b>
</div>

<div id="free" style="display:none">

<h3>🎁 Miễn phí</h3>

<p>Gói này không cần thanh toán.</p>

<button class="free" onclick="receiveFree()">
🎁 NHẬN ACC
</button>

</div>


<div id="paid" style="display:none">

<h3>💳 Thanh toán 10.000đ</h3>

<p>
Vui lòng thanh toán 10.000đ theo phương thức shop của bạn.
</p>

<button onclick="confirmPayment()">
TÔI ĐÃ THANH TOÁN
</button>

<div id="waiting" class="wait">

⏳ Đang chờ xác minh thanh toán...

<p>
Sau khi thanh toán được xác minh,
nút nhận acc mới được mở.
</p>

<button
id="receive"
style="display:none;background:#16a34a"
onclick="receivePaid()">
🎁 NHẬN ACC
</button>

</div>

</div>

<br>

<a href="index.html">← Về shop</a>

</div>


<script>

const q =
new URLSearchParams(location.search);

const bag =
q.get("bag") || "1";

const price =
Number(q.get("price") || 0);

document.getElementById("bag").textContent =
"Túi số " + bag;

document.getElementById("price").textContent =
price.toLocaleString("vi-VN") + " ₫";


/*
0đ → nhận acc ngay
10K → phải thanh toán
*/

if(price === 0){

document.getElementById("free").style.display =
"block";

}else if(price === 10000){

document.getElementById("paid").style.display =
"block";

}else{

document.getElementById("paid").style.display =
"block";

}


function receiveFree(){

window.location.href =
"giao-acc.html?bag=" +
encodeURIComponent(bag) +
"&price=0";

}


function confirmPayment(){

document.getElementById("waiting").style.display =
"block";

}


/*
Không tự xác nhận thanh toán thật.
Nút nhận acc phải được mở sau khi
shop xác minh thanh toán.
*/

function paymentApproved(){

document.getElementById("receive").style.display =
"block";

}


function receivePaid(){

window.location.href =
"giao-acc.html?bag=" +
encodeURIComponent(bag) +
"&price=" +
encodeURIComponent(price);

}

</script>

</body>
</html>
