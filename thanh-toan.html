<script>
const q = new URLSearchParams(location.search);

const bag = q.get("bag") || "1";
const price = Number(q.get("price") || 0);

document.getElementById("bag").textContent =
  "Túi số " + bag;

document.getElementById("price").textContent =
  price.toLocaleString("vi-VN") + " ₫";

function nhanAcc() {
  window.location.href =
    "giao-acc.html?bag=" +
    encodeURIComponent(bag) +
    "&price=" +
    encodeURIComponent(price);
}

// Túi 0đ: bỏ qua thanh toán
if (price === 0) {
  document.querySelector(".payment-section")?.remove();

  const btn = document.createElement("button");
  btn.className = "pay";
  btn.textContent = "🎁 NHẬN ACC MIỄN PHÍ";
  btn.onclick = nhanAcc;

  document.querySelector(".box").appendChild(btn);
}
</script>
